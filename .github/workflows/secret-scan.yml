name: secret-scan
# Scans every branch's full git history for leaked credentials on every PR and
# push to main. Uses the gitleaks binary directly (no licence key needed for
# org repos), pinned to a version and verified by SHA-256. Values are redacted.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
env:
  GITLEAKS_VERSION: 8.21.2
  GITLEAKS_SHA256: 5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tgz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
      - name: Self-test the rules on throwaway fixtures
        run: bash .github/secret-scan-selftest.sh "$RUNNER_TEMP/gitleaks" "$PWD/.gitleaks.toml"
      - name: Show scan scope
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -n "$PR_HEAD" ]; then git cat-file -e "$PR_HEAD^{commit}" && echo "PR head $PR_HEAD is in scope"; fi
          echo "branches: $(git for-each-ref refs/remotes refs/heads --format=x | wc -l)"
          echo "commits in scope (all refs): $(git rev-list --all --count)"
      - name: Scan full history of all refs (values redacted)
        run: |
          "$RUNNER_TEMP/gitleaks" git . --config .gitleaks.toml --log-opts="--all" \
            --redact --no-banner --verbose --exit-code 1
